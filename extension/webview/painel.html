<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Execução</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-main: #1e1e1e;
      --bg-card: #252526;
      --border-color: #3e3e42;
      --text-primary: #d4d4d4;
      --text-secondary: #a0a0a0;
      --accent: #007acc;
      --success: #4ec9b0;
      --error: #ef4444;
      --warning: #d7ba7d;
    }

    html { height: 100%; }
    body {
      height: 100%;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      line-height: 1.4;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 12px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    header button {
      padding: 4px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    header button:hover {
      opacity: 0.8;
    }

    header button.secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      border-right: 1px solid var(--border-color);
      background: var(--bg-card);
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .task-item {
      padding: 8px 12px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border-color);
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .task-item.active {
      background: var(--accent);
      border-left-color: white;
      color: white;
    }

    .task-item-title {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .task-item-meta {
      font-size: 10px;
      opacity: 0.6;
    }

    .task-item-state {
      display: inline-block;
      font-size: 9px;
      padding: 2px 4px;
      margin-top: 4px;
      border-radius: 2px;
    }

    .task-item-state.running {
      background: rgba(215, 186, 125, 0.2);
      color: var(--warning);
    }

    .task-item-state.completed {
      background: rgba(78, 201, 176, 0.2);
      color: var(--success);
    }

    .task-item-state.failed {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .workflow {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      gap: 12px;
    }

    .action-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(0, 122, 204, 0.2);
    }

    .action-card.selected {
      border-color: var(--accent);
      background: rgba(0, 122, 204, 0.1);
    }

    .action-icon {
      font-size: 18px;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
    }

    .action-content {
      flex: 1;
      min-width: 0;
    }

    .action-title {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .action-detail {
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .action-state {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(78, 201, 176, 0.2);
      color: var(--success);
      display: inline-block;
      margin-top: 4px;
    }

    .action-state.error {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }

    .inspector {
      width: 300px;
      border-left: 1px solid var(--border-color);
      background: var(--bg-card);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 12px;
    }

    .inspector-empty {
      color: var(--text-secondary);
      text-align: center;
      padding: 20px;
    }

    .inspector h2 {
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .inspector-section {
      margin-bottom: 16px;
    }

    .inspector-section-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .inspector-content {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      background: var(--bg-main);
      padding: 8px;
      border-radius: 2px;
      border: 1px solid var(--border-color);
      max-height: 200px;
      overflow-y: auto;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .summary {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      text-align: center;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📊 Painel Execução</h1>
      <button class="secondary" id="refreshBtn">Atualizar</button>
      <button id="newTaskBtn">+ Nova tarefa</button>
      <button class="secondary" id="continueBtn">Continuar</button>
    </header>

    <div class="container">
      <div class="sidebar">
        <div class="sidebar-header">Histórico</div>
        <div id="taskList"></div>
      </div>

      <div class="main">
        <div class="workflow" id="workflow"></div>
        <div class="summary" id="summary"></div>
      </div>

      <div class="inspector" id="inspector">
        <div class="inspector-empty">Clique em uma ação para ver detalhes</div>
      </div>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi?.() || null;
    let tasks = [];
    let selectedTaskId = null;
    let selectedActionIndex = null;

    function renderUI() {
      renderTaskList();
      renderWorkflow();
      renderSummary();
    }

    function renderTaskList() {
      const list = document.getElementById('taskList');
      list.innerHTML = tasks
        .map(task => `
          <div class="task-item ${task.id === selectedTaskId ? 'active' : ''}" onclick="selectTask('${task.id}')">
            <div class="task-item-title">${escapeHtml(task.title)}</div>
            <div class="task-item-meta">${task.actions.length} ações</div>
            <div class="task-item-state ${task.state}">${task.state === 'running' ? '⏱️ Em execução' : task.state === 'completed' ? '✅ Concluída' : '❌ Erro'}</div>
          </div>
        `)
        .join('');
    }

    function renderWorkflow() {
      const workflow = document.getElementById('workflow');
      const task = tasks.find(t => t.id === selectedTaskId);

      if (!task) {
        workflow.innerHTML = '<div class="empty-state"><p>Nenhuma tarefa selecionada</p></div>';
        return;
      }

      workflow.innerHTML = task.actions
        .map((action, idx) => `
          <div class="action-card ${idx === selectedActionIndex ? 'selected' : ''}" onclick="selectAction(${idx})">
            <div class="action-icon">${getActionIcon(action.type, action.toolName)}</div>
            <div class="action-content">
              <div class="action-title">${action.description}</div>
              ${action.filePath ? `<div class="action-detail">📄 ${escapeHtml(action.filePath.split(/[\\\\/]/).pop())}</div>` : ''}
              <div class="action-state ${action.error ? 'error' : ''}">${action.error ? '❌ Erro' : '✅ Sucesso'}</div>
            </div>
          </div>
        `)
        .join('');
    }

    function renderSummary() {
      const summary = document.getElementById('summary');
      const task = tasks.find(t => t.id === selectedTaskId);

      if (!task || !task.actions.length) {
        summary.innerHTML = '';
        return;
      }

      const toolCount = task.actions.filter(a => a.toolName).length;
      const errorCount = task.actions.filter(a => a.error).length;

      summary.innerHTML = `
        ${toolCount} ação(ões) ${errorCount > 0 ? `· ${errorCount} erro(s)` : '· sem erros'}
      `;
    }

    function selectTask(taskId) {
      selectedTaskId = taskId;
      selectedActionIndex = null;
      renderUI();
      updateInspector();
    }

    function selectAction(idx) {
      selectedActionIndex = idx;
      renderWorkflow();
      updateInspector();
    }

    function updateInspector() {
      const inspector = document.getElementById('inspector');
      const task = tasks.find(t => t.id === selectedTaskId);

      if (!task || selectedActionIndex === null) {
        inspector.innerHTML = '<div class="inspector-empty">Clique em uma ação para ver detalhes</div>';
        return;
      }

      const action = task.actions[selectedActionIndex];

      let html = `
        <h2>${action.description}</h2>
        <div class="inspector-section">
          <div class="inspector-section-title">Ferramenta</div>
          <div class="inspector-content">${action.toolName || 'N/A'}</div>
        </div>
      `;

      if (action.filePath) {
        html += `
          <div class="inspector-section">
            <div class="inspector-section-title">Arquivo</div>
            <div class="inspector-content">${escapeHtml(action.filePath)}</div>
          </div>
        `;
      }

      if (action.input) {
        html += `
          <div class="inspector-section">
            <div class="inspector-section-title">Entrada</div>
            <div class="inspector-content">${formatJson(action.input)}</div>
          </div>
        `;
      }

      if (action.output) {
        html += `
          <div class="inspector-section">
            <div class="inspector-section-title">Saída</div>
            <div class="inspector-content">${formatJson(action.output)}</div>
          </div>
        `;
      }

      if (action.error) {
        html += `
          <div class="inspector-section">
            <div class="inspector-section-title">Erro</div>
            <div class="inspector-content" style="color: var(--error);">${escapeHtml(action.error)}</div>
          </div>
        `;
      }

      inspector.innerHTML = html;
    }

    function getActionIcon(type, toolName) {
      if (toolName === 'Read') return '📖';
      if (toolName === 'Write') return '✍️';
      if (toolName === 'Edit') return '✏️';
      if (toolName === 'Bash') return '⌨️';
      if (toolName === 'Grep') return '🔍';
      if (type === 'user-input') return '👤';
      return '⚙️';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatJson(obj) {
      if (!obj) return 'N/A';
      if (typeof obj === 'string') return escapeHtml(obj.slice(0, 500));
      try {
        return escapeHtml(JSON.stringify(obj, null, 2).slice(0, 500));
      } catch {
        return escapeHtml(String(obj).slice(0, 500));
      }
    }

    document.getElementById('newTaskBtn').addEventListener('click', () => {
      vscode?.postMessage({ command: 'new-task' });
    });

    document.getElementById('continueBtn').addEventListener('click', () => {
      vscode?.postMessage({ command: 'continue-task' });
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      vscode?.postMessage({ command: 'refresh' });
    });

    window.addEventListener('message', event => {
      const message = event.data;
      if (message.command === 'update-tasks') {
        tasks = message.tasks;
        selectedTaskId = message.currentTaskId;
        selectedActionIndex = null;
        renderUI();
        updateInspector();
      }
    });

    if (vscode) {
      vscode.postMessage({ command: 'init' });
    }
  </script>
</body>
</html>
