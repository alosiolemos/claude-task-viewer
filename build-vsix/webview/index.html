<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Execução</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body {
      background: var(--vscode-editor-background, #1e1e1e);
      color: var(--vscode-editor-foreground, #d4d4d4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
    }
    #root { height: 100vh; width: 100%; display: flex; flex-direction: column; }
    .header {
      padding: 16px;
      border-bottom: 1px solid var(--vscode-panel-border, #3e3e42);
      background: var(--vscode-sideBar-background, #252526);
    }
    .header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .header p { margin: 4px 0 0 0; font-size: 11px; opacity: 0.7; }
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      opacity: 0.6;
    }
    .events-list { display: flex; flex-direction: column; gap: 8px; }
    .event-count { margin: 0 0 8px 0; font-weight: 600; font-size: 12px; opacity: 0.8; }
    .event-card {
      background: var(--vscode-list-hoverBackground, #2d2d30);
      border: 1px solid var(--vscode-list-focusOutline, #4a4a4a);
      border-radius: 4px;
      padding: 8px;
    }
    .event-header {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .event-time, .event-tool { opacity: 0.7; }
    .event-body { padding: 4px 0; }
    .event-id { margin: 4px 0; font-size: 10px; opacity: 0.6; word-break: break-all; }
    details { margin-top: 4px; font-size: 11px; }
    summary { cursor: pointer; opacity: 0.7; user-select: none; }
    summary:hover { opacity: 1; }
    pre {
      background: var(--vscode-editor-background, #1e1e1e);
      padding: 6px;
      border-radius: 3px;
      border: 1px solid var(--vscode-list-focusOutline, #4a4a4a);
      overflow-x: auto;
      font-size: 10px;
      margin: 4px 0 0 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .demo-badge {
      display: inline-block;
      background: var(--vscode-statusBar-warningBackground, #d7ba7d);
      color: #000;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 9px;
      font-weight: bold;
      margin-left: 8px;
    }
    .real-badge {
      display: inline-block;
      background: var(--vscode-statusBar-noFolderBackground, #007acc);
      color: #fff;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 9px;
      font-weight: bold;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="header">
      <h1>📊 Painel Execução</h1>
      <p>Acompanhamento e auditoria de execução do Claude Code</p>
    </div>
    <div class="main" id="events-container">
      <div class="empty">⏳ Carregando eventos...</div>
    </div>
  </div>

  <script>
    function renderEvents(events) {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      if (events.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        const p = document.createElement('p');
        p.textContent = 'Nenhum evento capturado.';
        empty.appendChild(p);
        container.appendChild(empty);
        return;
      }

      const list = document.createElement('div');
      list.className = 'events-list';

      const count = document.createElement('p');
      count.className = 'event-count';
      count.textContent = `📋 ${events.length} evento${events.length !== 1 ? 's' : ''}`;
      list.appendChild(count);

      events.forEach((evt) => {
        const card = document.createElement('div');
        card.className = 'event-card';

        const header = document.createElement('div');
        header.className = 'event-header';

        const time = document.createElement('span');
        time.className = 'event-time';
        time.textContent = `🕐 ${new Date(evt.timestamp).toLocaleTimeString('pt-BR')}`;
        header.appendChild(time);

        const tool = document.createElement('span');
        tool.className = 'event-tool';
        tool.textContent = `🔧 ${evt.event.tool_name || 'Desconhecido'}`;
        header.appendChild(tool);

        const source = evt.event.captureSource || 'desconhecido';
        const badge = document.createElement('span');
        badge.className = source === 'stdin' ? 'real-badge' : 'demo-badge';
        badge.textContent = source === 'stdin' ? 'REAL' : 'DEMO';
        header.appendChild(badge);

        card.appendChild(header);

        const body = document.createElement('div');
        body.className = 'event-body';

        const id = document.createElement('div');
        id.className = 'event-id';
        id.innerHTML = '<strong>ID:</strong> ';
        const idText = document.createElement('span');
        idText.textContent = (evt.event.tool_use_id || '').substring(0, 20) + '...';
        id.appendChild(idText);
        body.appendChild(id);

        if (evt.event.tool_input) {
          const details1 = document.createElement('details');
          const summary1 = document.createElement('summary');
          summary1.textContent = '📥 Entrada';
          details1.appendChild(summary1);
          const pre1 = document.createElement('pre');
          pre1.textContent = JSON.stringify(evt.event.tool_input, null, 2).substring(0, 300);
          details1.appendChild(pre1);
          body.appendChild(details1);
        }

        if (evt.event.tool_response) {
          const details2 = document.createElement('details');
          const summary2 = document.createElement('summary');
          summary2.textContent = '📤 Saída';
          details2.appendChild(summary2);
          const pre2 = document.createElement('pre');
          pre2.textContent = JSON.stringify(evt.event.tool_response, null, 2).substring(0, 300);
          details2.appendChild(pre2);
          body.appendChild(details2);
        }

        card.appendChild(body);
        list.appendChild(card);
      });

      container.appendChild(list);
    }

    // Listen for automatic updates from extension
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg.command === 'events-loaded' || msg.command === 'events-updated') {
        renderEvents(msg.events);
      }
    });

    // Show loading on startup
    const empty = document.createElement('div');
    empty.className = 'empty';
    const p = document.createElement('p');
    p.textContent = '⏳ Aguardando eventos...';
    empty.appendChild(p);
    document.getElementById('events-container').appendChild(empty);
  </script>
</body>
</html>
